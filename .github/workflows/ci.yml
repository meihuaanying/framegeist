name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: test + clippy (windows, golden regression)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (includes golden regression vs committed baselines)
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build (host)
        run: cargo build --release
      - name: render template sample wall (PRD C6)
        run: |
          cargo run --release -p framegeist-cli --example make_test_photos
          pwsh tools/gen-samples.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: template-samples
          path: templates/samples/
          retention-days: 30

  wasm:
    name: wasm build + CLI byte-identity smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build wasm + glue
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128
          cargo build -p framegeist-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --out-dir web/pkg --target web target/wasm32-unknown-unknown/release/framegeist_wasm.wasm
      - name: CLI byte-identity smoke (PRD N2)
        run: |
          cargo build --release -p framegeist-cli
          cargo run --release -p framegeist-cli --example make_test_photos
          node tools/wasm-smoke.mjs

  portability:
    name: cross-target build of framegeist-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-unknown
          - aarch64-linux-android
          - aarch64-unknown-linux-ohos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target ${{ matrix.target }}
        run: cargo build -p framegeist-core --release --target ${{ matrix.target }}
