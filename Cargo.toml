[workspace]
resolver = "2"
members = ["crates/framegeist-core", "crates/framegeist-cli", "crates/framegeist-wasm", "crates/framegeist-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["framegeist contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

