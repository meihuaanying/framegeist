[package]
name = "framegeist-wasm"
description = "WebAssembly bindings for the FrameGeist engine (Web client, PRD G)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
framegeist-core = { path = "../framegeist-core" }
wasm-bindgen = "0.2"
serde_json = "1"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
