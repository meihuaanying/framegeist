<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameGeist · 框灵</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script>
  // Anti-FOUC: apply stored/system theme before first paint.
  (function () {
    var stored = localStorage.getItem("fg-theme") || "auto";
    var dark = stored === "dark" || (stored === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">FG</span>
    <h1>FrameGeist <span style="color:var(--text-faint)">框灵</span></h1>
    <small data-i18n="app.tagline">照片全程本地处理 · 不上传 · 可离线</small>
  </div>
  <span class="spacer"></span>
  <span class="pill busy" id="statusPill"><span class="dot"></span><span id="statusText" data-i18n="status.boot">引擎加载中…</span></span>
  <button class="icon-btn" id="themeBtn" title="主题">◐</button>
  <button class="icon-btn" id="langBtn">EN</button>
</header>

<main class="shell">
  <aside>
    <div class="card">
      <div class="seg">
        <button id="modeFrame" class="on" data-i18n="mode.frame">边框模板</button>
        <button id="modeCollage" data-i18n="mode.collage">拼图</button>
      </div>
      <div style="height:12px"></div>
      <label class="dropzone" id="dropzone" for="fileInput">
        <div data-i18n="drop.main">拖入照片，或点击选择</div>
        <div class="hint" data-i18n="drop.hint">支持 JPEG / PNG / WebP / TIFF；拼图模式可多选</div>
      </label>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple hidden>
      <div class="file-meta" id="fileMeta"></div>
    </div>

    <div class="card" id="framePanels">
      <h2 data-i18n="template.title">模板</h2>
      <div class="search-wrap">
        <input type="search" id="tplSearch" data-i18n-placeholder="template.search" placeholder="搜索模板…">
      </div>
      <div class="chips" id="catChips"></div>
      <div class="grid" id="templateGrid"></div>
    </div>

    <div class="card hidden" id="collagePanels">
      <h2 data-i18n="layout.title">布局</h2>
      <div class="search-wrap">
        <input type="search" id="layoutSearch" data-i18n-placeholder="layout.search" placeholder="搜索布局…">
      </div>
      <div class="layout-grid" id="layoutGrid"></div>
    </div>

    <div class="card" id="tweakCard">
      <h2 data-i18n="tweak.title">微调（仅此模板）</h2>
      <div class="field">
        <label><span data-i18n="tweak.size">文字大小</span><b id="sizeVal">100%</b></label>
        <input type="range" id="sizeRange" min="0.5" max="2" step="0.05" value="1">
      </div>
      <div class="field">
        <label><span data-i18n="tweak.padding">内边距</span><b id="padVal">100%</b></label>
        <input type="range" id="padRange" min="0.5" max="2" step="0.05" value="1">
      </div>
      <div class="field">
        <div class="color-row">
          <input type="checkbox" id="useColor">
          <span data-i18n="tweak.color">文字颜色</span>
          <span class="spacer"></span>
          <input type="color" id="colorPick" value="#111111" disabled>
        </div>
      </div>
      <button class="btn ghost" id="resetTweaks" data-i18n="tweak.reset">重置微调</button>
    </div>

    <div class="card">
      <label class="muted"><input type="checkbox" id="preview" checked> <span data-i18n="btn.preview">快速预览采样</span></label>
      <div style="height:10px"></div>
      <button class="btn primary" id="renderBtn" data-i18n="btn.render">渲染预览</button>
      <div style="height:8px"></div>
      <button class="btn" id="exportBtn" disabled data-i18n="btn.export">导出 JPEG</button>
      <div style="height:8px"></div>
      <button class="btn hidden" id="exportBatchBtn">导出全部</button>
      <div style="height:12px"></div>
      <div class="progress hidden" id="progressWrap"><i id="progressBar"></i></div>
      <div style="height:12px"></div>
      <button class="btn ghost" id="updateBtn" data-i18n="btn.update">检查更新</button>
      <div id="updateBox" class="muted hidden" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2 data-i18n="exif.title">EXIF 信息</h2>
      <div class="muted" id="exifEmpty" data-i18n="exif.none">拖入照片后显示</div>
      <dl class="kv hidden" id="exifList"></dl>
    </div>
  </aside>

  <section class="card stage-card">
    <div class="stage-head">
      <span id="stageLabel" data-i18n="stage.placeholder">拖入一张照片开始</span>
    </div>
    <div class="stage" id="stage">
      <span class="placeholder" data-i18n="stage.placeholder">拖入一张照片开始</span>
    </div>
  </section>
</main>

<div class="toasts" id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
