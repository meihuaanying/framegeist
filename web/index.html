<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameGeist · 框灵</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #f4f4f2;
    color: #1a1a1a;
  }
  header {
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid #e2e2e2;
    display: flex;
    gap: 16px;
    align-items: baseline;
  }
  h1 { font-size: 18px; margin: 0; }
  header small { color: #777; }
  main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  #controls {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  select, input[type="file"] { width: 100%; }
  #drop {
    border: 2px dashed #bbb;
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    color: #666;
  }
  #drop.over { border-color: #1a73e8; background: #eef4ff; }
  #stage {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 12px;
  }
  #stage img { max-width: 100%; max-height: 82vh; }
  #exif {
    font-family: monospace;
    font-size: 12px;
    color: #555;
    white-space: pre-wrap;
    max-height: 160px;
    overflow: auto;
  }
  button {
    padding: 8px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 12px; color: #888; }
  .mode-row { display: flex; gap: 8px; }
  .mode-row button { flex: 1; }
  .mode-row button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  #collageControls, #frameControls { display: flex; flex-direction: column; gap: 10px; }
  #updateBox { font-size: 12px; background: #fffbe8; border: 1px solid #e8d98a; border-radius: 6px; padding: 8px 10px; display: none; }
</style>
</head>
<body>
<header>
  <h1>FrameGeist · 框灵</h1>
  <small>照片全程在本地处理，不上传任何服务器（G1）· 离线可用（G4）</small>
  <span id="status">loading engine…</span>
</header>
<main>
  <section id="controls">
    <div class="mode-row">
      <button id="modeFrame" class="on">边框模板</button>
      <button id="modeCollage">拼图</button>
    </div>
    <div id="drop">拖入照片（拼图模式可多选），
      <input type="file" id="file" accept="image/*,.heic,.heif" multiple>
    </div>
    <div id="frameControls">
      <label>模板
        <select id="template" disabled><option>loading…</option></select>
      </label>
    </div>
    <div id="collageControls" style="display:none">
      <label>布局
        <select id="layout" disabled><option>loading…</option></select>
      </label>
    </div>
    <label><input type="checkbox" id="preview" checked> 快速预览采样</label>
    <button id="renderBtn" disabled>渲染</button>
    <button id="exportBtn" disabled>导出 JPEG</button>
    <button id="updateBtn">检查更新</button>
    <div id="updateBox"></div>
    <pre id="exif">EXIF: -</pre>
  </section>
  <section id="stage"><span style="color:#aaa">拖入一张照片开始</span></section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
