<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameGeist · 框灵</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script>
  (function () {
    var stored = localStorage.getItem("fg-theme") || "auto";
    var dark = stored === "dark" || (stored === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">FG</span>
    <h1>FrameGeist <span style="color:var(--text-faint)">框灵</span></h1>
    <small data-i18n="app.tagline">照片全程本地处理 · 不上传 · 可离线</small>
  </div>
  <span class="spacer"></span>
  <span class="pill busy" id="statusPill"><span class="dot"></span><span id="statusText" data-i18n="status.boot">引擎加载中…</span></span>
  <button class="icon-btn" id="settingsBtn" data-i18n-title="settings.title" title="设置">⚙</button>
  <button class="icon-btn" id="themeBtn" title="主题">◐</button>
  <button class="icon-btn" id="langBtn">EN</button>
</header>

<main class="shell">
  <aside class="sidebar">
    <div class="card">
      <div class="seg">
        <button id="modeFrame" class="on" data-i18n="mode.frame">边框模板</button>
        <button id="modeCollage" data-i18n="mode.collage">拼图</button>
      </div>
      <div style="height:10px"></div>
      <label class="dropzone" id="dropzone" for="fileInput">
        <div data-i18n="drop.main">拖入照片，或点击选择</div>
        <div class="hint" data-i18n="drop.hint">JPEG / PNG / WebP / TIFF；拼图模式可多选</div>
      </label>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <div class="file-meta" id="fileMeta"></div>
    </div>

    <details class="card" id="templateCard" open>
      <summary data-i18n="panel.template">模板</summary>
      <div class="body">
        <div class="search-wrap">
          <input type="search" id="tplSearch" data-i18n-placeholder="search.templates" placeholder="搜索模板…">
        </div>
        <div class="cat-chips" id="catChips"></div>
        <div class="pinned" id="pinned"><span data-i18n="panel.template">模板</span>: <b id="pinnedName">—</b><span class="spacer" style="flex:1"></span><span class="muted" id="pinnedCat"></span></div>
        <div class="picker-head">
          <span class="muted" id="tplCount"></span>
          <span class="spacer"></span>
          <button class="icon-btn" id="pickerCompact" data-i18n-title="picker.compact">▦</button>
          <button class="icon-btn" id="pickerLarge" data-i18n-title="picker.large">▤</button>
        </div>
        <div class="grid" id="templateGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="layoutCard">
      <summary data-i18n="panel.layout">布局</summary>
      <div class="body">
        <div class="search-wrap">
          <input type="search" id="layoutSearch" data-i18n-placeholder="search.layouts" placeholder="搜索布局…">
        </div>
        <div class="layout-grid" id="layoutGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="canvasCard">
      <summary data-i18n="panel.canvas">画布</summary>
      <div class="body">
        <label class="row"><span data-i18n="canvas.aspect">比例</span></label>
        <select id="aspectSelect">
          <option value="original" data-i18n="canvas.aspectOriginal">原图</option>
          <option value="1:1">1:1</option><option value="4:3">4:3</option><option value="3:2">3:2</option>
          <option value="16:9">16:9</option><option value="9:16">9:16</option>
        </select>
        <label class="row"><span data-i18n="canvas.background">背景填充</span></label>
        <select id="bgSelect">
          <option value="default" data-i18n="canvas.bgDefault">模板默认</option>
          <option value="blur" data-i18n="canvas.bgBlur">模糊</option>
          <option value="solid" data-i18n="canvas.bgSolid">纯色</option>
          <option value="image" data-i18n="canvas.bgImage">图片</option>
          <option value="none" data-i18n="canvas.bgNone">无</option>
        </select>
        <div class="color-row" style="margin-top:8px">
          <span class="muted" data-i18n="canvas.bgColor">背景色</span>
          <input type="color" id="bgColor" value="#FFFFFF">
          <span class="spacer" style="flex:1"></span>
          <button class="btn small ghost" id="uploadBg" style="width:auto;padding:0 10px" data-i18n="canvas.uploadBg">上传背景图</button>
        </div>
        <input type="file" id="bgFile" accept="image/*" hidden>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn small" id="flipH" data-i18n="canvas.flipH">水平翻转</button>
          <button class="btn small" id="flipV" data-i18n="canvas.flipV">垂直翻转</button>
        </div>
        <button class="btn small ghost" id="resetCanvas" style="margin-top:8px" data-i18n="canvas.reset">重置画布</button>
      </div>
    </details>

    <details class="card" id="tweakCard">
      <summary data-i18n="panel.tweaks">微调</summary>
      <div class="body">
        <div class="field">
          <label><span data-i18n="tweak.size">文字大小</span><b id="sizeVal">100%</b></label>
          <input type="range" id="sizeRange" min="0.5" max="2" step="0.05" value="1">
        </div>
        <div class="field">
          <label><span data-i18n="tweak.padding">内边距</span><b id="padVal">100%</b></label>
          <input type="range" id="padRange" min="0.5" max="2" step="0.05" value="1">
        </div>
        <div class="field">
          <div class="color-row">
            <input type="checkbox" id="useColor">
            <span data-i18n="tweak.color">文字颜色</span>
            <span class="spacer" style="flex:1"></span>
            <input type="color" id="colorPick" value="#111111" disabled>
          </div>
        </div>
        <label class="row"><span data-i18n="tweak.font">字体</span></label>
        <div style="display:flex;gap:6px">
          <select id="fontSelect" style="flex:1"></select>
          <button class="btn small" id="uploadFont" style="width:auto;padding:0 10px" data-i18n="tweak.uploadFont">上传字体</button>
          <input type="file" id="fontFile" accept=".ttf,.otf" hidden>
        </div>
        <button class="btn small ghost" id="resetTweaks" style="margin-top:8px" data-i18n="tweak.reset">重置微调</button>
      </div>
    </details>

    <details class="card hidden" id="brandCard">
      <summary data-i18n="panel.brand">品牌 Logo</summary>
      <div class="body">
        <label class="row"><input type="checkbox" id="brandShow" checked><span data-i18n="brand.show">显示品牌 Logo</span></label>
        <div class="muted" id="brandDetected" style="margin:4px 0 8px"></div>
        <label class="row"><span data-i18n="brand.source">来源</span></label>
        <div class="btn-row">
          <button class="btn small" id="brandAuto" data-i18n="brand.auto">自动识别</button>
          <button class="btn small" id="brandNone" data-i18n="brand.none">不显示</button>
        </div>
        <div class="brand-grid" id="brandGrid"></div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn small" id="uploadLogo" data-i18n="brand.uploadCustom">上传 Logo</button>
          <button class="btn small ghost" id="clearLogo" data-i18n="canvas.clearBg">清除</button>
        </div>
        <input type="file" id="logoFile" accept="image/*" hidden>
      </div>
    </details>

    <details class="card hidden" id="exifEditCard">
      <summary data-i18n="panel.exifEdit">EXIF 文字</summary>
      <div class="body">
        <div class="muted" style="margin-bottom:6px" data-i18n="exifEdit.fieldHelp"></div>
        <div class="field-chips" id="fieldChips"></div>
        <div id="lineEditor"></div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn small ghost" id="resetLines" data-i18n="exifEdit.reset">重置文字</button>
          <button class="btn small" id="saveTemplate" data-i18n="exifEdit.save">保存为模板</button>
        </div>
        <div id="saveRow" class="hidden" style="margin-top:8px">
          <input type="text" id="saveName" data-i18n-placeholder="exifEdit.namePrompt" placeholder="模板名称">
          <div class="btn-row" style="margin-top:6px">
            <button class="btn small primary" id="confirmSave" data-i18n="exifEdit.save">保存为模板</button>
            <button class="btn small ghost" id="cancelSave">✕</button>
          </div>
        </div>
        <button class="btn small ghost" id="importTemplate" style="margin-top:6px" data-i18n="exifEdit.import">导入 .fgt</button>
        <input type="file" id="fgtFile" accept=".fgt,.json,.zip" hidden>
      </div>
    </details>

    <details class="card" id="exifCard">
      <summary data-i18n="panel.exif">EXIF 信息</summary>
      <div class="body">
        <div class="muted" id="exifEmpty" data-i18n="exif.none">拖入照片后显示</div>
        <dl class="kv hidden" id="exifList"></dl>
      </div>
    </details>

    <div class="actionbar">
      <label class="muted"><input type="checkbox" id="preview" checked> <span data-i18n="btn.preview">快速预览采样</span></label>
      <label class="row" style="margin:0"><span data-i18n="export.size">输出尺寸</span>
        <select id="exportSize" style="width:auto">
          <option value="0" data-i18n="export.original">原图</option>
          <option value="6144">6K · 6144</option>
          <option value="3840">4K · 3840</option>
          <option value="2048">2K · 2048</option>
          <option value="custom" data-i18n="export.custom">自定义长边</option>
        </select>
      </label>
      <input type="number" id="exportCustom" class="hidden" min="256" max="30000" step="16" value="3000" data-i18n-placeholder="export.customPx">
      <button class="btn primary" id="renderBtn" data-i18n="btn.render">渲染预览</button>
      <div class="btn-row">
        <button class="btn" id="exportBtn" disabled data-i18n="btn.export">导出 JPEG</button>
        <button class="btn hidden" id="exportBatchBtn" data-i18n="btn.exportBatch">批量导出</button>
      </div>
      <div class="progress hidden" id="progressWrap"><i id="progressBar"></i></div>
      <button class="btn ghost small" id="updateBtn" data-i18n="btn.update">检查更新</button>
      <div id="updateBox" class="muted hidden"></div>
    </div>
  </aside>

  <section class="workspace">
    <div class="stage-card">
      <div class="stage-head">
        <span id="stageLabel" data-i18n="stage.placeholder">拖入一张照片开始</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="zoomOut" data-i18n-title="stage.zoomOut">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="icon-btn" id="zoomIn" data-i18n-title="stage.zoomIn">＋</button>
        <button class="icon-btn" id="zoomFit" data-i18n-title="stage.fit">⤢</button>
        <button class="icon-btn" id="zoomReset" data-i18n-title="stage.reset">↺</button>
      </div>
      <div class="viewport" id="viewport">
        <div class="canvas-wrap" id="canvasWrap"></div>
        <div class="skeleton" id="skeleton"><div class="bar"></div></div>
        <span class="placeholder" id="stagePlaceholder" data-i18n="stage.placeholder">拖入一张照片开始</span>
      </div>
    </div>
  </section>
</main>

<div class="lightbox hidden" id="lightbox">
  <div class="lb-backdrop" id="lbBackdrop"></div>
  <div class="lb-body">
    <div class="lb-head">
      <b id="lbName">—</b>
      <span class="muted" id="lbCat"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="icon-btn" id="lbPrev" data-i18n-title="lightbox.prev">‹</button>
      <button class="icon-btn" id="lbNext" data-i18n-title="lightbox.next">›</button>
      <button class="icon-btn" id="lbClose" data-i18n-title="lightbox.close">✕</button>
    </div>
    <div class="lb-stage"><img id="lbImg" alt=""></div>
    <div class="lb-foot">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <button class="btn primary" id="lbApply" data-i18n="lightbox.apply">应用此模板</button>
        <p class="muted hidden" id="lbNotice" style="margin:0;max-width:640px;text-align:center;font-size:11.5px"></p>
      </div>
    </div>
  </div>
</div>

<div class="settings hidden" id="settings">
  <div class="lb-backdrop" id="settingsBackdrop"></div>
  <div class="settings-panel">
    <div class="lb-head">
      <b data-i18n="settings.title">设置</b>
      <span class="spacer" style="flex:1"></span>
      <button class="icon-btn" id="settingsClose" data-i18n-title="settings.close">✕</button>
    </div>
    <div class="settings-body">
      <section>
        <h3 data-i18n="settings.appearance"></h3>
        <label class="row"><span data-i18n="settings.theme"></span>
          <select id="setTheme" style="width:auto">
            <option value="auto" data-i18n="settings.themeAuto"></option>
            <option value="light" data-i18n="settings.themeLight"></option>
            <option value="dark" data-i18n="settings.themeDark"></option>
          </select>
        </label>
        <label class="row"><span data-i18n="settings.language"></span>
          <select id="setLang" style="width:auto"><option value="zh">中文</option><option value="en">English</option></select>
        </label>
      </section>
      <section>
        <h3 data-i18n="settings.export"></h3>
        <label class="row"><span data-i18n="settings.exportSize"></span>
          <select id="setExportSize" style="width:auto">
            <option value="0" data-i18n="export.original"></option>
            <option value="6144">6K</option><option value="3840">4K</option><option value="2048">2K</option>
            <option value="custom" data-i18n="export.custom"></option>
          </select>
        </label>
      </section>
      <section>
        <h3 data-i18n="settings.defaults"></h3>
        <label class="row"><span data-i18n="settings.defaultFont"></span>
          <select id="setDefaultFont" style="width:auto"></select>
        </label>
        <div class="field"><label><span data-i18n="settings.defaultFontSize"></span><b id="setSizeVal">100%</b></label>
          <input type="range" id="setDefaultSize" min="0.5" max="2" step="0.05" value="1"></div>
        <label class="row"><input type="checkbox" id="setDefaultColorOn"><span data-i18n="settings.defaultColor"></span>
          <input type="color" id="setDefaultColor" value="#111111"></label>
        <label class="row"><input type="checkbox" id="setDefaultLogo"><span data-i18n="settings.defaultLogo"></span></label>
      </section>
      <section>
        <h3 data-i18n="settings.privacy"></h3>
        <label class="row"><input type="checkbox" id="setKeepGps"><span data-i18n="settings.keepGps"></span></label>
        <p class="muted" data-i18n="settings.privacyNote"></p>
      </section>
      <section>
        <h3 data-i18n="settings.data"></h3>
        <p class="muted" id="storageInfo"></p>
        <div class="btn-row">
          <button class="btn small ghost" id="clearTweaks" data-i18n="settings.clearTweaks"></button>
          <button class="btn small ghost" id="clearMyTemplates" data-i18n="settings.clearMyTemplates"></button>
          <button class="btn small ghost" id="clearAssets" data-i18n="settings.clearAssets"></button>
          <button class="btn small ghost" id="clearCache" data-i18n="settings.clearCache"></button>
        </div>
        <button class="btn small" id="resetAll" style="margin-top:8px" data-i18n="settings.resetAll"></button>
      </section>
      <section class="hidden" id="desktopSection">
        <h3 data-i18n="settings.desktop"></h3>
        <label class="row"><span data-i18n="settings.saveMode"></span>
          <select id="setSaveMode" style="width:auto">
            <option value="dialog" data-i18n="settings.saveDialog"></option>
            <option value="downloads" data-i18n="settings.saveDownloads"></option>
          </select>
        </label>
        <label class="row"><span data-i18n="settings.channel"></span>
          <select id="setChannel" style="width:auto"><option value="stable">stable</option><option value="beta" disabled>beta</option></select>
        </label>
      </section>
      <section>
        <h3 data-i18n="settings.about"></h3>
        <p class="muted" id="aboutVersion"></p>
        <button class="btn small ghost" id="aboutCheck" data-i18n="btn.update"></button>
        <div class="btn-row" style="margin-top:8px">
          <a class="btn small ghost" href="https://github.com/meihuaanying/framegeist/blob/main/docs/CREDITS.md" target="_blank" rel="noreferrer" data-i18n="settings.licenses"></a>
          <a class="btn small ghost" href="https://github.com/meihuaanying/framegeist" target="_blank" rel="noreferrer" data-i18n="settings.repo"></a>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
