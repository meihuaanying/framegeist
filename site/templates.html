<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Templates — FrameGeist</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./site.css">
<script>(function(){var s=localStorage.getItem("fg-theme")||"auto";var d=s==="dark"||(s==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";})();</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="mark">FG</span>FrameGeist <span class="muted">框灵</span></a>
  <nav class="nav">
    <a href="./templates.html" data-nav data-i18n="nav.templates">模板墙</a>
    <a href="./download.html" data-nav data-i18n="nav.download">下载</a>
    <a href="./docs.html" data-nav data-i18n="nav.docs">文档</a>
    <a href="./market.html" data-nav data-i18n="nav.market">模板市场</a>
    <a href="./sponsor.html" data-nav data-i18n="nav.sponsor">赞助</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" data-theme-btn>◐</button>
  <button class="icon-btn" data-lang-btn>EN</button>
</header>

<main class="wrap section">
  <h2 style="font-family:var(--font-display);font-size:26px" data-i18n="wall.title">模板墙</h2>
  <p class="muted" data-i18n="wall.note"></p>
  <div class="filters" id="filters"></div>
  <div class="wall" id="wall"></div>
</main>

<footer class="footer"><span data-i18n="footer"></span> · <a href="https://github.com/meihuaanying/framegeist">GitHub</a></footer>
<script type="module">
  import { init, t, currentLang } from "./site.js";
  init();
  const CATS = ["white-border","camera","phone","drone","fuji","film","colorwalk","colorful","classic-watermark","portfolio","black-frame","sports","calendar","magazine","minimal","borderless","master","personal","polaroid","festival","effect","colorcard","blur-bg","ticket","game"];
  let all = [];
  let activeCat = "all";
  const filters = document.getElementById("filters");
  const wall = document.getElementById("wall");
  const noteEl = document.querySelector('[data-i18n="wall.note"]');
  const tplName = (tpl) => (tpl.names && tpl.names[currentLang()]) || tpl.name || tpl.id;
  const catLabel = (c) => (t("cat." + c) !== `cat.${c}` ? t("cat." + c) : c);
  const buildFilters = () => {
    filters.innerHTML = "";
    const mk = (id, label) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = activeCat === id ? "on" : "";
      b.onclick = () => { activeCat = id; buildFilters(); show(activeCat); };
      filters.appendChild(b);
    };
    mk("all", t("wall.all"));
    for (const c of CATS) mk(c, catLabel(c));
  };
  function show(cat) {
    wall.innerHTML = "";
    const list = all.filter((x) => cat === "all" || x.category === cat);
    if (noteEl) noteEl.textContent = `${t("wall.note")} · ${t("wall.count", { n: list.length })}`;
    for (const tpl of list) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const img = document.createElement("img");
      img.loading = "lazy"; img.src = `./samples/${tpl.id}.jpg`; img.alt = tplName(tpl);
      const cap = document.createElement("div");
      cap.className = "cap";
      const nm = document.createElement("b"); nm.textContent = tplName(tpl);
      const catSpan = document.createElement("span"); catSpan.textContent = catLabel(tpl.category);
      cap.appendChild(nm); cap.appendChild(catSpan);
      cell.appendChild(img); cell.appendChild(cap);
      wall.appendChild(cell);
    }
  }
  fetch("./web/templates.json").then(r => r.json()).then(list => { all = list; buildFilters(); show(activeCat); });
  window.addEventListener("fg-lang-changed", () => { buildFilters(); show(activeCat); });
</script>
</body>
</html>
