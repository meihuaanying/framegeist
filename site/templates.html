<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Templates — FrameGeist</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./site.css">
<script>(function(){var s=localStorage.getItem("fg-theme")||"auto";var d=s==="dark"||(s==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";})();</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="mark">FG</span>FrameGeist <span class="muted">框灵</span></a>
  <nav class="nav">
    <a href="./templates.html" data-nav data-i18n="nav.templates">模板墙</a>
    <a href="./download.html" data-nav data-i18n="nav.download">下载</a>
    <a href="./docs.html" data-nav data-i18n="nav.docs">文档</a>
    <a href="./market.html" data-nav data-i18n="nav.market">模板市场</a>
    <a href="./sponsor.html" data-nav data-i18n="nav.sponsor">赞助</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" data-theme-btn>◐</button>
  <button class="icon-btn" data-lang-btn>EN</button>
</header>

<main class="wrap section">
  <h2 style="font-family:var(--font-display);font-size:26px" data-i18n="wall.title">模板墙</h2>
  <p class="muted" data-i18n="wall.note"></p>
  <div class="filters" id="filters"></div>
  <div class="wall" id="wall"></div>
</main>

<footer class="footer"><span data-i18n="footer"></span> · <a href="https://github.com/meihuaanying/framegeist">GitHub</a></footer>
<script type="module">
  import { init, t } from "./site.js";
  init();
  const CATS = ["white-border","camera","phone","drone","fuji","film","colorwalk","colorful","classic-watermark","portfolio","black-frame","sports","calendar","magazine","minimal","borderless","master","personal","polaroid","festival","effect","colorcard","blur-bg","ticket","game"];
  let all = [];
  const filters = document.getElementById("filters");
  const wall = document.getElementById("wall");
  const mkBtn = (id, label) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { document.querySelectorAll("#filters button").forEach(x => x.classList.remove("on")); b.classList.add("on"); show(id); };
    filters.appendChild(b);
    return b;
  };
  let first;
  [["all", t("wall.all")], ...CATS.map(c => [c, c])].forEach(([id, label]) => { const b = mkBtn(id, label); if (!first) { first = b; b.classList.add("on"); } });
  function show(cat) {
    wall.innerHTML = "";
    for (const tpl of all.filter(x => cat === "all" || x.category === cat)) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.innerHTML = `<img loading="lazy" src="./samples/${tpl.id}.jpg" alt=""><div class="cap"><b>${tpl.name}</b><span>${tpl.category}</span></div>`;
      wall.appendChild(cell);
    }
  }
  fetch("./web/templates.json").then(r => r.json()).then(list => { all = list; show("all"); });
</script>
</body>
</html>
