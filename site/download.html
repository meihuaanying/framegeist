<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download — FrameGeist</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./site.css">
<script>(function(){var s=localStorage.getItem("fg-theme")||"auto";var d=s==="dark"||(s==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";})();</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="mark">FG</span>FrameGeist <span class="muted">框灵</span></a>
  <nav class="nav">
    <a href="./templates.html" data-nav data-i18n="nav.templates">模板墙</a>
    <a href="./download.html" data-nav data-i18n="nav.download">下载</a>
    <a href="./docs.html" data-nav data-i18n="nav.docs">文档</a>
    <a href="./market.html" data-nav data-i18n="nav.market">模板市场</a>
    <a href="./sponsor.html" data-nav data-i18n="nav.sponsor">赞助</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" data-theme-btn>◐</button>
  <button class="icon-btn" data-lang-btn>EN</button>
</header>

<main class="wrap section">
  <h2 style="font-family:var(--font-display);font-size:26px" data-i18n="dl.title">下载</h2>
  <p class="muted" data-i18n="dl.note"></p>
  <div id="rel"><span class="muted" data-i18n="dl.loading">读取 Releases…</span></div>
</main>

<footer class="footer"><span data-i18n="footer"></span> · <a href="https://github.com/meihuaanying/framegeist">GitHub</a></footer>
<script type="module">
  import { init, t } from "./site.js";
  init();
  const REPO = "meihuaanying/framegeist";
  const el = document.getElementById("rel");
  async function main() {
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const rel = await r.json();
      const rows = (rel.assets || []).map(a => `
        <tr>
          <td>${a.name}</td>
          <td>${(a.size / 1048576).toFixed(1)} MB</td>
          <td><a href="${a.browser_download_url}">${t("dl.download")}</a></td>
        </tr>`).join("");
      el.innerHTML = `
        <div style="margin-bottom:14px">
          <b style="font-family:var(--font-display);font-size:18px">${rel.tag_name}</b>
          <span class="muted"> · ${new Date(rel.published_at).toLocaleString()} ·
          <a href="${rel.html_url}">GitHub Release</a></span>
        </div>
        <table class="dl">
          <tr><th>${t("dl.file")}</th><th>${t("dl.size")}</th><th>${t("dl.link")}</th></tr>
          ${rows || `<tr><td colspan="3">${t("dl.empty")}</td></tr>`}
        </table>`;
    } catch (e) {
      el.innerHTML = `<p class="muted">${t("dl.fail", { e: e.message })}</p>`;
    }
  }
  main();
  window.addEventListener("fg-lang-changed", main);
</script>
</body>
</html>
